name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: codehound
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: codehound_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codehound -d codehound_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CODEHOUND_TEST_POSTGRES_URL: postgresql+psycopg://codehound:test-only@localhost:5432/codehound_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './backend[dev]'
      - run: ruff check backend
      - run: ruff format --check backend
      - run: pytest backend/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './backend[dev]'
      - run: docker build -t codehound-python-test:ci backend/test-environments/python
      - name: Test isolated execution
        run: |
          CODEHOUND_TEST_IMAGE_ID="$(docker image inspect --format '{{.Id}}' codehound-python-test:ci)" pytest backend/tests/test_docker_runner.py backend/tests/test_independent.py backend/tests/test_integrity.py backend/tests/test_benchmark.py backend/tests/test_cleanup.py backend/tests/test_impact.py backend/tests/test_operator_profiles.py
