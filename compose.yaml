services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codehound}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codehound_local}
      POSTGRES_DB: ${POSTGRES_DB:-codehound}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  postgres_data:
