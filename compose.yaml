services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codehound}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codehound_local}
      POSTGRES_DB: ${POSTGRES_DB:-codehound}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      CODEHOUND_DATABASE_URL: ${CODEHOUND_DATABASE_URL:-}
      CODEHOUND_POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-codehound}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codehound_local}
      POSTGRES_DB: ${POSTGRES_DB:-codehound}
      CODEHOUND_EXECUTION_IMAGE_ID: ${CODEHOUND_EXECUTION_IMAGE_ID:-}
      CODEHOUND_FRONTEND_URL: ${CODEHOUND_FRONTEND_URL:-http://localhost:5173}
      # Bare entries preserve unset versus explicitly empty operator settings.
      CODEHOUND_SESSION_ENCRYPTION_KEY:
      CODEHOUND_MAX_PENDING_PER_ACCOUNT:
      CODEHOUND_MAX_PENDING_EXECUTIONS:
      CODEHOUND_MUTATION_REQUEST_LIMIT:
      CODEHOUND_OAUTH_REQUEST_LIMIT:
      CODEHOUND_REQUEST_LIMIT_WINDOW_SECONDS:
      CODEHOUND_REQUEST_LIMIT_MAX_BUCKETS:
      CODEHOUND_MAX_VERIFICATIONS_PER_ACCOUNT:
      CODEHOUND_MAX_VERIFICATIONS_TOTAL:
      CODEHOUND_MAX_EXECUTIONS_PER_ACCOUNT:
      CODEHOUND_MAX_EXECUTIONS_TOTAL:
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  postgres_data:
